# Fleet baseline, tuned for Actions workflows and Helm YAML. Rationale: github-actions-align/templates/README.md#yamllintyml
extends: default

rules:
  document-start:
    present: false

  line-length: disable

  truthy:
    allowed-values: ['true', 'false', 'yes', 'no', 'on', 'off']
    check-keys: false

  comments:
    min-spaces-from-content: 1

  indentation:
    spaces: 2
    indent-sequences: true

  empty-lines:
    max-end: 1

ignore: |
  .worktrees/
  node_modules/
  vendor/
  charts/
  # Helm chart templates are Go templates, not YAML — `{{- if }}` is a hard
  # syntax error to yamllint. `helm lint` + `helm template` cover them instead.
  templates/
  # controller-gen output (CRDs, RBAC) — generated, not hand-edited.
  config/
  chart/crds/
